name: Test and deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Type-check app and tests
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publishes the plain-text test report to a ci-report/<branch> branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Type-check output for the report (the typecheck job is the actual gate)
        run: npm run typecheck > typecheck.txt 2>&1 || true
      - name: Unit tests with coverage
        id: tests
        run: npx vitest run --coverage --reporter=default --reporter=json --outputFile.json=test-results.json
      - name: Publish test report
        if: always()
        run: |
          node tools/test-report.mjs || true
          BR="ci-report/${GITHUB_REF_NAME}"
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          cp ci-report.txt /tmp/ci-report.txt
          git checkout --orphan report-tmp && git rm -rfq . >/dev/null && cp /tmp/ci-report.txt ci-report.txt
          echo "${GITHUB_SHA}" > sha.txt && git add ci-report.txt sha.txt && git commit -qm "report ${GITHUB_SHA}"
          git push -fq origin "HEAD:refs/heads/${BR}"

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publishes the plain-text e2e report to a ci-e2e/<branch> branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: npx vite build
      - name: End-to-end smoke tests (desktop, Android, iPhone)
        run: npx playwright test
      - name: Publish e2e report
        if: always()
        run: |
          node tools/e2e-report.mjs || true
          cp e2e-report.txt /tmp/e2e-report.txt
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git checkout --orphan report-tmp && git rm -rfq . >/dev/null && cp /tmp/e2e-report.txt e2e-report.txt
          echo "${GITHUB_SHA}" > sha.txt && git add e2e-report.txt sha.txt && git commit -qm "e2e report ${GITHUB_SHA}"
          git push -fq origin "HEAD:refs/heads/ci-e2e/${GITHUB_REF_NAME}"

  build:
    needs: [typecheck, test, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
